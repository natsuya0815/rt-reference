<main class="main"><div class="topbar"><button class="icon-btn menu-toggle" id="menuToggle" aria-label="メニューを開く">☰</button><span class="crumb">RT / Clinical Reference</span><div class="search-wrap"><input class="search" id="search" autocomplete="off" placeholder="癌種・60 Gy / 20 fr・V20・IPF などを検索" aria-label="リファレンス検索"><div class="search-result" id="searchResults"></div></div><button class="icon-btn" id="themeToggle" aria-label="配色を切り替える" title="配色切替">◐</button></div><div class="content" id="content"></div></main></div>

<script>
'use strict';
const SEED = window.RT_SEED;
const KEY='rt_reference_beta_v01'; // keep localStorage across upgrades
const TABS=[['overview','概要'],['regimens','処方線量'],['oar','OAR制約'],['systemic','併用療法'],['toxicity','有害事象'],['outcomes','予後・成績'],['refs','文献'],['notes','検討メモ']];
const seedById=Object.fromEntries(SEED.cancers.map(x=>[x.id,x]));
const sourceMap=Object.fromEntries(SEED.sources.map(x=>[x.id,x]));
const CLINICAL=SEED.clinicalNotes||[];
let notesFilter="all";
const emptyCancer = (name,group,id)=>({id,name,group,aliases:[],status:'skeleton',summary:'新規登録。治療情報は未登録です。',topics:[],regimens:[],oar:[],systemic:[],toxicity:[],outcomes:[],guidance:[],local:''});
const defaultStore={customCancers:[],memos:[],favorites:['prostate','nsclc'],theme:'light',modified:''};
let store=readStore(),current='prostate',tab='overview',oarRegime='all',oarOrgan='all',allSources=false,searchTimer;
function readStore(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object'){return {...defaultStore,...v,customCancers:Array.isArray(v.customCancers)?v.customCancers:[],memos:Array.isArray(v.memos)?v.memos:[],favorites:Array.isArray(v.favorites)?v.favorites:[]};}}catch{}return structuredClone(defaultStore)}
function persist(){store.modified=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){flash('保存できませんでした。容量やブラウザ設定を確認してください。')}}
function cancers(){return [...SEED.cancers,...store.customCancers]}
function getCancer(id=current){return cancers().find(x=>x.id===id)||SEED.cancers[0]}
function escapeH(str=''){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function textLines(str){return escapeH(str).replace(/\n/g,'<br>')}
function safeURL(u){try{let x=new URL(u);return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch{return ''}}
function statusPill(status){return status==='expanded'?'<span class="pill good">重点整備</span>':status==='partial'?'<span class="pill warn">一部整備</span>':'<span class="pill">情報未整備</span>'}
function refsHtml(ids){if(!Array.isArray(ids)||!ids.length)return '<span class="ref empty">院内検討・根拠未照合</span>';return ids.map(id=>{let s=sourceMap[id];return s?`<a class="ref" target="_blank" rel="noopener noreferrer" href="${escapeH(safeURL(s.url))}" title="${escapeH(s.title)}">↗ ${escapeH(s.title.slice(0,16))} · ${escapeH(s.year.slice(0,4))}</a>`:''}).join('')}
function flash(message){let t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),3000)}
function button(label,handler,cls='btn'){return `<button class="${cls}" data-act="${handler}">${label}</button>`}
function navigate(id,t='overview'){current=id;tab=t;oarRegime='all';oarOrgan='all';document.getElementById('search').value='';document.getElementById('searchResults').classList.remove('show');closeSidebar();render();window.scrollTo({top:0,behavior:'instant'})}
function changeTab(t){tab=t;renderContent();window.scrollTo({top:0,behavior:'smooth'})}
function toggleFav(){let i=store.favorites.indexOf(current);if(i>=0)store.favorites.splice(i,1);else store.favorites.push(current);persist();render()}
function renderSidebar(){const g=Object.groupBy?Object.groupBy(cancers(),x=>x.group):cancers().reduce((a,x)=>((a[x.group]??=[]).push(x),a),{});const order=['胸部','泌尿器','乳腺','中枢神経','消化器','頭頸部','婦人科','血液','転移・緩和','その他'];let html='<div class="section-label">QUICK ACCESS</div>'+`<button class="side-item ${current==='_library'?'active':''}" data-nav="_library">▦　全癌種・文献一覧</button>`+`<button class="side-item ${current==='_clinical'?'active':''}" data-nav="_clinical">▤　診療プロジェクト知見 <span class="tiny-dot expanded"></span></button>`;let favs=cancers().filter(x=>store.favorites.includes(x.id));if(favs.length){html+='<div class="section-label">お気に入り</div>';html+=favs.map(x=>`<button class="side-item ${x.id===current?'active':''}" data-nav="${escapeH(x.id)}"><span>☆　${escapeH(x.name)}</span><span class="tiny-dot ${x.status}"></span></button>`).join('')};for(const group of order){if(!g[group]?.length)continue;html+=`<div class="section-label">${escapeH(group)}</div>`;html+=g[group].map(x=>`<button class="side-item ${x.id===current?'active':''}" data-nav="${escapeH(x.id)}"><span>${escapeH(x.name)}</span><span class="tiny-dot ${escapeH(x.status)}"></span></button>`).join('')}document.getElementById('sidenav').innerHTML=html}
function render(){renderSidebar();renderContent()}
function renderContent(){const area=document.getElementById('content');if(current==='_library'){area.innerHTML=renderLibrary();return}if(current==='_clinical'){area.innerHTML=renderClinicalIndex();return}const x=getCancer();let fav=store.favorites.includes(x.id);let inner=`<div class="kicker">RADIATION ONCOLOGY · ${escapeH(x.group)}</div><div class="head"><div><h1 class="page-title">${escapeH(x.name)}</h1><p class="description">${escapeH(x.summary)}</p></div><div class="head-actions">${button(fav?'★ お気に入り':'☆ お気に入り','favorite')}${button('＋ 検討メモ','addMemo','btn primary')}</div></div><div class="badges">${statusPill(x.status)}${x.topics.map(y=>`<span class="pill blue">${escapeH(y)}</span>`).join('')}</div><div class="notice">⚠️ <b>診療の最終判断には使用条件と原典確認が必要です。</b> 数値は分割・輪郭定義・照射条件に依存します。「施設検討」はガイドライン推奨ではありません。最終データ確認：2026-11-12。</div>`;inner+=`<nav class="tabs" aria-label="項目">${TABS.map(([k,v])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</nav>`;if(tab==='overview')inner+=viewOverview(x);if(tab==='regimens')inner+=viewRegimens(x);if(tab==='oar')inner+=viewOAR(x);if(tab==='systemic')inner+=viewSimple(x,'併用薬物療法',x.systemic,'具体的な薬剤・用量・投与時期は最新の国内承認・レジメンを参照してください。');if(tab==='toxicity')inner+=viewSimple(x,'有害事象・対応',x.toxicity,'有害事象の重症度評価・鑑別・治療手順は未完成です。');if(tab==='outcomes')inner+=viewOutcomes(x);if(tab==='refs')inner+=viewRefs(x);if(tab==='notes')inner+=viewNotes(x);inner+=viewClinicalNotes(x.id,tab==='notes'?'all':tab);area.innerHTML=inner+`<div class="foot">RT Reference β v0.2.0 · 参考情報・臨床判断補助。患者情報・個人識別情報は入力しないでください。<br>検索とメモは端末内で動作し、外部AI・病院システムとの同期はありません。原典の著作権に配慮し、要約とリンクを掲載しています。</div>`}
function viewOverview(x){let more=store.memos.filter(m=>m.cancer===x.id).length;return `<div class="stats"><div class="stat"><span>処方・分割</span><strong>${x.regimens.length}</strong></div><div class="stat"><span>OAR制約</span><strong>${x.oar.length}</strong></div><div class="stat"><span>出典（紐付け）</span><strong>${new Set([...x.regimens.flatMap(r=>r.refs),...x.oar.flatMap(r=>r.refs),...x.outcomes.flatMap(r=>r.refs),...CLINICAL.filter(n=>n.cancer===x.id).flatMap(n=>n.refs||[])]).size}</strong></div><div class="stat"><span>個人メモ</span><strong>${more}</strong></div></div><div class="info-grid"><section class="panel"><h2 class="panel-title">☷　クイック参照</h2><p class="panel-sub">よく使う領域を直接開く</p><div class="quick-nav"><button data-tab="regimens">処方線量 ${x.regimens.length}</button><button data-tab="oar">OAR ${x.oar.length}</button><button data-tab="refs">文献</button></div>${x.regimens.slice(0,3).map(r=>`<div style="padding:9px 0;border-bottom:1px solid var(--stroke)"><div class="minor muted">${escapeH(r.label)}</div><b>${escapeH(r.dose)}</b>${r.kind?.startsWith('院内')?' <span class="pill warn mini">施設検討</span>':''}</div>`).join('')||'<div class="empty">処方線量を準備中</div>'}</section><section class="panel"><h2 class="panel-title">⛨　適用時の注意</h2>${x.guidance?.length?`<ul class="clean-list minor">${x.guidance.map(v=>`<li>${escapeH(v)}</li>`).join('')}</ul>`:'<div class="empty">適用条件・注意点を順次追加します</div>'}</section></div><section class="panel"><h2 class="panel-title">更新状況</h2><div class="info-banner">この版の医学データは静的なスナップショットです。自動で最新ガイドラインを取り込む機能は<b>まだありません</b>。アプリの更新時には原典を再確認してください。</div><p class="minor muted">初期文献：日本（JASTRO・国内論文）、欧州（ESTRO・臨床試験・医学雑誌）、米国（ASTRO・QUANTEC・RCT）。</p></section>`}
function viewRegimens(x){let items=x.regimens||[];return `<div class="panel"><h2 class="panel-title">処方線量・分割回数 <span class="pill">${items.length}件</span></h2><p class="panel-sub">ガイドライン・臨床試験の情報と、施設独自の検討は別扱い</p><div class="info-banner blue-banner">処方の適否は病期、照射目的、併用療法、既照射歴、PTV/OAR条件で変わります。ここにない値を自動補完しません。</div>${items.length?`<div class="info-grid">${items.map(r=>`<article class="regimen ${r.kind?.startsWith('院内')?'local':''}"><div class="label">${escapeH(r.label)}</div><div class="value">${escapeH(r.dose)}</div><div class="detail">${escapeH(r.detail)}</div>${r.note?`<div class="minor" style="margin-top:7px;color:var(--orange)">${escapeH(r.note)}</div>`:''}<div class="bottom">${r.kind==='標準・文献'?'<span class="pill good mini">文献出典あり</span>':'<span class="pill warn mini">施設検討・未承認</span>'}${refsHtml(r.refs)}</div></article>`).join('')}</div>`:'<div class="empty">この癌種の具体的な処方線量は未登録です。未検証の数値は表示していません。</div>'}</div>`}
function viewOAR(x){let list=x.oar||[],regimes=[...new Set(list.map(x=>x.regime))],organs=[...new Set(list.map(x=>x.organ))],filtered=list.filter(i=>(oarRegime==='all'||i.regime===oarRegime)&&(oarOrgan==='all'||i.organ===oarOrgan));return `<section class="panel"><h2 class="panel-title">OAR線量制約 <span class="pill">${list.length}項目</span></h2><div class="info-banner warn-banner"><b>重要：</b>Vxの定義、%とcc、輪郭（臓器全体/壁）、線量計算法、分割回数、目標値の強さ（protocol / proposal / reference）を必ず確認してください。特にSBRTや再照射へ転用しないでください。</div>${list.length?`<div class="filters"><select id="filterRegime" aria-label="分割別フィルター"><option value="all">すべての分割</option>${regimes.map(k=>`<option value="${escapeH(k)}" ${oarRegime===k?'selected':''}>${escapeH(k)}</option>`).join('')}</select><select id="filterOrgan" aria-label="臓器別フィルター"><option value="all">すべての臓器</option>${organs.map(k=>`<option value="${escapeH(k)}" ${oarOrgan===k?'selected':''}>${escapeH(k)}</option>`).join('')}</select></div><div class="table-scroll"><table><thead><tr><th>臓器</th><th>分割・条件</th><th>指標</th><th>制約・目標</th><th>由来・適用条件</th><th>出典</th></tr></thead><tbody>${filtered.map(v=>`<tr><td><strong>${escapeH(v.organ)}</strong></td><td>${escapeH(v.regime)}</td><td><b>${escapeH(v.metric)}</b></td><td><strong>${escapeH(v.goal)}</strong></td><td><span class="pill mini ${v.level.includes('提案')?'warn':'blue'}">${escapeH(v.level)}</span>${v.note?`<p class="minor muted">${escapeH(v.note)}</p>`:''}</td><td>${refsHtml(v.refs)}</td></tr>`).join('')}</tbody></table></div>${filtered.length?'':'<div class="empty">条件に合う制約はありません</div>'}`:'<div class="empty">この癌種の制約値はまだ登録していません。数値の推測表示はしません。</div>'}</section>`}
function viewSimple(x,title,arr,caveat){return `<section class="panel"><h2 class="panel-title">${escapeH(title)}</h2><div class="info-banner blue-banner">${escapeH(caveat)}</div>${arr?.length?`<ul class="clean-list">${arr.map(v=>`<li>${escapeH(v)}</li>`).join('')}</ul>`:'<div class="empty">現在、検証済みの詳細情報を登録していません。後続版で充実させます。</div>'}</section>`}
function viewOutcomes(x){return `<section class="panel"><h2 class="panel-title">治療成績・予後</h2><div class="info-banner warn-banner">試験群の成績は、現代の病期分類・リスク群・患者背景・併用薬を揃えずに個別症例の予後として使えません。</div>${x.outcomes?.length?x.outcomes.map(v=>`<article class="regimen" style="margin-bottom:12px"><b>${escapeH(v.title)}</b><div class="value">${escapeH(v.value)}</div><div class="detail">${escapeH(v.detail)}</div><div class="bottom">${refsHtml(v.refs)}</div></article>`).join(''):'<div class="empty">病期別の予後データは未登録です。信頼できる研究の条件ごとに追加します。</div>'}</section>`}
function uniqueRefs(x){return [...new Set([...x.regimens.flatMap(x=>x.refs||[]),...x.oar.flatMap(x=>x.refs||[]),...x.outcomes.flatMap(x=>x.refs||[]),...CLINICAL.filter(n=>n.cancer===x.id).flatMap(n=>n.refs||[]),...(['prostate','nsclc','sclc','bone','brainmets'].includes(x.id)?['jastro24','jastro-index']:[])])]}
function sourceCard(s){return `<div class="source-card"><div class="source-title">${escapeH(s.title)}</div><div class="source-meta"><span class="pill mini">${escapeH(s.region)}</span><span class="pill mini blue">${escapeH(s.type)}</span><span>${escapeH(s.year)}</span>${s.doi?`<span>DOI: ${escapeH(s.doi)}</span>`:''}</div><div class="minor source-url"><a target="_blank" rel="noopener noreferrer" href="${escapeH(safeURL(s.url))}">↗ 原典・公式ページを開く</a></div>${s.note?`<p class="source-note">${escapeH(s.note)}</p>`:''}</div>`}
function viewRefs(x){let ids=uniqueRefs(x);return `<section class="panel"><h2 class="panel-title">関連ガイドライン・原著論文</h2><p class="panel-sub">数値に結びつく直接の原典を優先して掲載しています。</p>${ids.length?ids.map(id=>sourceMap[id]).filter(Boolean).map(sourceCard).join(''):'<div class="empty">この癌種固有の文献リンクは未登録です。</div>'}<p class="minor muted">共通の参照先：<a href="https://www.jastro.or.jp/medicalpersonnel/guideline/jastro/" target="_blank" rel="noopener noreferrer">JASTROガイドライン一覧 ↗</a></p></section>`}
function viewNotes(x){let notes=store.memos.filter(m=>m.cancer===x.id);return `<section class="panel"><h2 class="panel-title">個別検討・院内メモ ${button('＋ 新規メモ','addMemo','btn small primary')}</h2><div class="info-banner warn-banner">こちらはガイドライン推奨・承認済み院内プロトコールと<b>区別</b>する領域です。患者識別情報を入力しないでください。端末内保存のみです。</div>${x.local?`<article class="memo-card"><div class="memo-head"><b>プロジェクトからの初期検討記録（要再確認）</b><span class="pill warn mini">初期搭載</span></div><p class="memo-body">${escapeH(x.local)}</p></article>`:''}${notes.map(m=>`<article class="memo-card"><div class="memo-head"><b>${escapeH(m.title)}</b><button class="btn small danger" data-del-memo="${escapeH(m.id)}">削除</button></div><div class="source-meta"><span class="pill mini warn">${escapeH(m.type)}</span><span>${escapeH(m.created.slice(0,10))}</span></div><p class="memo-body">${escapeH(m.body)}</p>${safeURL(m.url)?`<a href="${escapeH(safeURL(m.url))}" target="_blank" rel="noopener noreferrer" class="minor">出典URL ↗</a>`:''}</article>`).join('')}${!x.local&&!notes.length?'<div class="empty">検討メモはまだありません。</div>':''}</section>`}

function noteCard(n,compact=false){let cancer=cancers().find(c=>c.id===n.cancer);let itemName=cancer?.name||'診療一般';let details=compact?'':`<ul class="clean-list minor">${n.points.map(p=>`<li>${escapeH(p)}</li>`).join('')}</ul>`;return `<article class="clinical-note" id="${escapeH(n.id)}"><div class="note-meta"><span class="pill mini blue">${escapeH(itemName)}</span><span class="pill mini">${escapeH(TABS.find(t=>t[0]===n.section)?.[1]||'一般')}</span><span class="pill mini ${n.strength?.includes('裏付け')?'good':'warn'}">${escapeH(n.strength)}</span><span class="muted minor">相談 ${escapeH(n.month)}</span></div><h3 class="clinical-heading">${escapeH(n.title)}</h3><p class="note-summary">${escapeH(n.summary)}</p>${details}${n.caution?`<div class="note-caution">適用時の注意：${escapeH(n.caution)}</div>`:''}<div class="note-refs"><span class="muted minor">参考文献</span> ${refsHtml(n.refs)}</div>${compact?`<button class="btn small" data-note-open="${escapeH(n.id)}">詳しく見る</button>`:''}</article>`}
function viewClinicalNotes(cancer,section){let a=CLINICAL.filter(n=>n.cancer===cancer&&(section==='all'||section===n.section));if(!a.length)return '';return `<section class="panel"><h2 class="panel-title">診療プロジェクトからの知見 <span class="pill">${a.length}件</span></h2><p class="panel-sub">過去の相談を匿名化・要約して再構成。参照文献は一般的な根拠であり、個別症例への処方妥当性を保証しません。</p>${a.map(n=>noteCard(n)).join('')}</section>`}
function renderClinicalIndex(){let counts={};CLINICAL.forEach(n=>counts[n.cancer]=(counts[n.cancer]||0)+1);let options=[{id:'all',name:'すべてのテーマ'},...cancers().filter(c=>counts[c.id]).map(c=>({id:c.id,name:c.name})),{id:'general',name:'診療一般'}];let shown=CLINICAL.filter(n=>notesFilter==='all'||n.cancer===notesFilter);return `<div class="kicker">CLINICAL NOTES / PROJECT ARCHIVE</div><div class="head"><div><h1 class="page-title">診療プロジェクト知見</h1><p class="description">これまでの相談から参照可能な臨床論点を整理。癌種別タブの関連項目にも表示します。</p></div></div><div class="stats"><div class="stat"><span>収録ノート</span><strong>${CLINICAL.length}</strong></div><div class="stat"><span>文献・原典</span><strong>${SEED.sources.length}</strong></div><div class="stat"><span>関連癌種</span><strong>${Object.keys(counts).filter(x=>x!=='general').length}</strong></div><div class="stat"><span>出典付き</span><strong>${CLINICAL.filter(n=>n.refs?.length).length}</strong></div></div><div class="notice">⚠️ チャットの逐語保存ではなく、会話履歴から確認可能なテーマを再構成した知識ノートです。全過去会話の完全抽出を保証するものではありません。根拠未確認項目は診療指示として用いないでください。</div><section class="panel"><div class="note-filter"><label for="filterNotes"><b>分類で絞り込み</b></label><select id="filterNotes">${options.map(o=>`<option value="${escapeH(o.id)}" ${notesFilter===o.id?'selected':''}>${escapeH(o.name)} (${o.id==='all'?CLINICAL.length:counts[o.id]||0})</option>`).join('')}</select></div><p class="minor muted">表示 ${shown.length}件。タイトルや内容は画面上部の検索欄からも検索できます。</p>${shown.map(n=>noteCard(n)).join('')}</section>`}
function openClinicalNote(id){let n=CLINICAL.find(n=>n.id===id);if(!n)return;if(n.cancer==='general'){notesFilter='general';navigate('_clinical');}else{navigate(n.cancer,n.section);}requestAnimationFrame(()=>document.getElementById(n.id)?.scrollIntoView({behavior:'smooth',block:'start'}))}

function renderLibrary(){let cs=cancers();let summary=cs.map(x=>`<button class="side-item" style="color:var(--ink);background:var(--surface);border:1px solid var(--stroke);padding:14px;border-radius:12px;min-height:75px" data-nav="${escapeH(x.id)}"><span><b>${escapeH(x.name)}</b><br><small class="muted">${escapeH(x.group)}　·　処方${x.regimens.length} / OAR${x.oar.length}</small></span><span class="tiny-dot ${x.status}"></span></button>`).join('');return `<div class="kicker">LIBRARY / ALL TOPICS</div><div class="head"><div><h1 class="page-title">癌種・情報源一覧</h1><p class="description">登録済み癌種を開いて参照。新しい癌種や個別検討を追加できます。</p></div><div class="head-actions">${button('＋ 癌種追加','addCancer','btn primary')}</div></div><div class="stats"><div class="stat"><span>登録癌種</span><strong>${cs.length}</strong></div><div class="stat"><span>OAR制約</span><strong>${cs.reduce((s,x)=>s+x.oar.length,0)}</strong></div><div class="stat"><span>処方候補</span><strong>${cs.reduce((s,x)=>s+x.regimens.length,0)}</strong></div><div class="stat"><span>文献・資料</span><strong>${SEED.sources.length}</strong></div></div><div class="panel"><h2 class="panel-title">診療プロジェクトからの整理</h2><p class="minor muted">過去の医療系チャットから、識別情報を除いた臨床上の論点を${CLINICAL.length}件収録。各ノートに参考文献や要照合のラベルを付けています。</p><button class="btn primary" data-nav="_clinical">↗ 診療ノートの一覧を見る</button></div><div class="panel"><h2 class="panel-title">癌種一覧 ${button('＋ 追加','addCancer','btn small')}</h2><div class="info-grid">${summary}</div></div><div class="panel"><h2 class="panel-title">初期収録の情報源</h2><p class="panel-sub">JASTRO、ASTRO、ESTROのガイドラインと、日本・欧米の査読付き論文。</p>${SEED.sources.map(sourceCard).join('')}</div><div class="panel"><h2 class="panel-title">データの管理</h2><p class="minor muted">癌種追加・個人メモはブラウザの端末内保存です。公開資料の医学データはアプリ本体を更新して反映します。自動監視・自動同期は未実装です。</p><div style="display:flex;gap:8px;flex-wrap:wrap">${button('↓ JSONバックアップ','export')}${button('↑ JSON復元','import')}${button('保存データを初期化','reset','btn danger')}</div></div><div class="foot">最終データ確認：2026-11-12 ・ 医療従事者の確認を前提としたベータ版</div>`}
function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';document.getElementById('dialog').querySelector('input, textarea, select')?.focus()}
function closeModal(){document.getElementById('modal').classList.remove('open');document.body.style.overflow=''}
function modalCancer(){openModal(`<form id="formCancer"><h2>癌種を追加</h2><p>共通タブを持つ新しい癌種を追加します。最初は未整備状態です。</p><div class="field"><label for="cName">癌種名 *</label><input id="cName" maxlength="65" required placeholder="例：胆道癌"></div><div class="field"><label for="cGroup">分類</label><select id="cGroup">${['胸部','泌尿器','乳腺','中枢神経','消化器','頭頸部','婦人科','血液','転移・緩和','その他'].map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div><div class="dialog-actions"><button class="btn" type="button" data-act="closeModal">キャンセル</button><button class="btn primary" type="submit">登録する</button></div></form>`);document.getElementById('formCancer').addEventListener('submit',e=>{e.preventDefault();let n=document.getElementById('cName').value.trim(),g=document.getElementById('cGroup').value;if(!n||cancers().some(x=>x.name===n)){flash('空欄または同名の癌種は登録できません');return}let id='custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);store.customCancers.push(emptyCancer(n,g,id));persist();closeModal();navigate(id);flash('癌種を追加しました')})}
function modalMemo(){let xs=cancers();openModal(`<form id="formMemo"><h2>検討メモを追加</h2><p>出典・検討状況を添えて端末内に保存します。未検証メモとして表示されます。</p><div class="field"><label for="mCancer">癌種</label><select id="mCancer">${xs.map(x=>`<option value="${escapeH(x.id)}" ${x.id===current?'selected':''}>${escapeH(x.name)}</option>`).join('')}</select></div><div class="field"><label for="mType">分類</label><select id="mType"><option>臨床検討（未検証）</option><option>論文メモ（未検証）</option><option>院内プロトコール案（未承認）</option><option>有害事象メモ（未検証）</option></select></div><div class="field"><label for="mTitle">タイトル *</label><input id="mTitle" maxlength="150" required placeholder="例：前立腺骨盤SIBの検討"></div><div class="field"><label for="mBody">内容 *</label><textarea id="mBody" maxlength="12000" required placeholder="患者を識別できる情報は入力しないでください"></textarea></div><div class="field"><label for="mUrl">原典URL（任意・https://）</label><input id="mUrl" type="url" placeholder="https://..."></div><div class="dialog-actions"><button class="btn" type="button" data-act="closeModal">キャンセル</button><button class="btn primary" type="submit">保存する</button></div></form>`);document.getElementById('formMemo').addEventListener('submit',e=>{e.preventDefault();let cancer=document.getElementById('mCancer').value,title=document.getElementById('mTitle').value.trim(),body=document.getElementById('mBody').value.trim(),url=document.getElementById('mUrl').value.trim();if(!title||!body)return;if(url&&!safeURL(url)){flash('URLはhttp(s)で入力してください');return}store.memos.unshift({id:'memo_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),cancer,title,body,url,type:document.getElementById('mType').value,created:new Date().toISOString()});persist();closeModal();navigate(cancer,'notes');flash('メモを端末内に保存しました')})}
function exportData(){let data={schema:'RTReferenceUserData',schemaVersion:1,exportedAt:new Date().toISOString(),data:{customCancers:store.customCancers,memos:store.memos,favorites:store.favorites}};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rt-reference-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);flash('バックアップJSONを出力しました')}
function importData(){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let file=f.files[0];if(!file)return;if(file.size>2e6)throw Error('ファイルサイズが2MBを超えています');let z=JSON.parse(await file.text());if(z.schema!=='RTReferenceUserData'||z.schemaVersion!==1||!z.data||!Array.isArray(z.data.customCancers)||!Array.isArray(z.data.memos))throw Error('RT ReferenceのバックアップJSONではありません');if(!confirm('端末内の追加癌種・メモをバックアップで置き換えます。続行しますか？'))return;let v=z.data;if(v.customCancers.length>500||v.memos.length>2000)throw Error('データ件数が多すぎます');for(let c of v.customCancers){if(!c.id||!c.name||typeof c.name!=='string'||c.name.length>65||!/^custom_/.test(c.id))throw Error('癌種データが不正です')}for(let m of v.memos){if(!m.id||typeof m.body!=='string'||m.body.length>12000||typeof m.title!=='string'||m.title.length>150)throw Error('メモデータが不正です')}store.customCancers=v.customCancers.map(c=>({...emptyCancer(c.name,String(c.group||'その他').slice(0,60),c.id)}));store.memos=v.memos.map(m=>({id:String(m.id).slice(0,90),cancer:String(m.cancer||''),title:String(m.title),body:String(m.body),type:String(m.type||'臨床検討（未検証）').slice(0,80),url:safeURL(m.url),created:String(m.created||new Date().toISOString()).slice(0,60)}));store.favorites=Array.isArray(v.favorites)?v.favorites.filter(s=>typeof s==='string').slice(0,80):[];persist();current='_library';render();flash('バックアップを復元しました')}catch(e){flash('読み込み失敗：'+e.message)}};f.click()}
function resetData(){if(confirm('この端末に保存した追加癌種・検討メモ・お気に入りをすべて消去します。よろしいですか？')){store=structuredClone(defaultStore);persist();current='_library';render();flash('端末内の追加データを初期化しました')}}
function delMemo(id){if(confirm('このメモを削除しますか？')){store.memos=store.memos.filter(x=>x.id!==id);persist();renderContent();flash('削除しました')}}
function normalize(s){return String(s).toLowerCase().normalize('NFKC').replace(/[\s　]+/g,'').replace(/gy/g,'gy')}
function searchRecords(q){let terms=q.trim().split(/\s+/).map(normalize).filter(Boolean);if(!terms.length)return[];let result=cancers().map(x=>{let related=CLINICAL.filter(n=>n.cancer===x.id);let sections=[['oar',JSON.stringify(x.oar)],['regimens',JSON.stringify(x.regimens)],['toxicity',JSON.stringify(x.toxicity)],['systemic',JSON.stringify(x.systemic)],['outcomes',JSON.stringify(x.outcomes)],['notes',x.local+' '+store.memos.filter(m=>m.cancer===x.id).map(m=>m.title+' '+m.body).join(' ')],...['overview','regimens','oar','systemic','toxicity','outcomes'].map(k=>[k,JSON.stringify(related.filter(n=>n.section===k))])];let basic=normalize([x.name,x.group,x.summary,...x.aliases,...x.topics].join(' '));let all=normalize([basic,...sections.map(y=>y[1])].join(' '));if(!terms.every(term=>all.includes(term)))return null;let matched=related.find(n=>terms.every(term=>normalize(JSON.stringify(n)).includes(term)));let best=matched?.section||sections.find(([k,v])=>terms.some(t=>normalize(v).includes(t)))?.[0]||'overview';return {x,tab:best,note:matched,score:terms.reduce((n,t)=>n+(basic.includes(t)?10:1),0)+(matched?3:0)}}).filter(Boolean);let clinical=CLINICAL.filter(n=>n.cancer==='general'&&terms.every(t=>normalize(JSON.stringify(n)).includes(t)));if(clinical.length){let n=clinical[0];result.push({x:{id:'_clinical',name:'診療一般',group:'診療一般',summary:n.title},tab:'notes',note:n,score:6})}return result.sort((a,b)=>b.score-a.score).slice(0,18)}
function updateSearch(){let input=document.getElementById('search'),v=input.value.trim(),res=document.getElementById('searchResults');if(!v){res.classList.remove('show');return}let items=searchRecords(v);res.innerHTML=items.length?items.map(z=>`<button class="search-row" data-search-go="${escapeH(z.x.id)}" data-search-tab="${escapeH(z.tab)}" data-search-note="${escapeH(z.note?.id||'')}"><b>${escapeH(z.x.name)}</b><small>${escapeH(z.note?.title||z.x.group+' ／ '+(TABS.find(t=>t[0]===z.tab)?.[1]||'概要')+' ／ '+z.x.summary.slice(0,60))}</small></button>`).join(''):'<div class="empty">該当する項目がありません。癌種・略語・線量指標で再検索してください。</div>';res.classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open')}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}let btn=e.target.closest('[data-tab]');if(btn){changeTab(btn.dataset.tab);return}let search=e.target.closest('[data-search-go]');if(search){if(search.dataset.searchNote)openClinicalNote(search.dataset.searchNote);else navigate(search.dataset.searchGo,search.dataset.searchTab);return}let nopen=e.target.closest('[data-note-open]');if(nopen){openClinicalNote(nopen.dataset.noteOpen);return}let del=e.target.closest('[data-del-memo]');if(del){delMemo(del.dataset.delMemo);return}let act=e.target.closest('[data-act]')?.dataset.act;if(act){({favorite:toggleFav,addMemo:modalMemo,addCancer:modalCancer,closeModal,export:exportData,import:importData,reset:resetData}[act])?.();return}if(!e.target.closest('.search-wrap'))document.getElementById('searchResults').classList.remove('show')});
document.addEventListener('change',e=>{if(e.target.id==='filterRegime'){oarRegime=e.target.value;renderContent()}if(e.target.id==='filterOrgan'){oarOrgan=e.target.value;renderContent()}if(e.target.id==='filterNotes'){notesFilter=e.target.value;renderContent()}})
document.getElementById('addCancerSide').onclick=modalCancer;document.getElementById('menuToggle').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('shade').classList.add('open')};document.getElementById('shade').onclick=closeSidebar;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(updateSearch,110)});document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let b=document.querySelector('#searchResults [data-search-go]');if(b){e.preventDefault();navigate(b.dataset.searchGo,b.dataset.searchTab)}}if(e.key==='Escape')document.getElementById('searchResults').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar()}});
document.getElementById('themeToggle').onclick=()=>{store.theme=store.theme==='dark'?'light':'dark';document.body.classList.toggle('dark',store.theme==='dark');persist()};
document.body.classList.toggle('dark',store.theme==='dark');render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
