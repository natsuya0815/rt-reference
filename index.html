<script>
'use strict';

const KEY='rt_reference_beta_v01'; // keep localStorage across upgrades
const TABS=[['pathways','病期別・処方'],['overview','概要'],['regimens','処方線量'],['oar','OAR制約'],['systemic','併用療法'],['toxicity','有害事象'],['outcomes','予後・成績'],['refs','文献'],['notes','検討メモ'],['differences','日欧米の差'],['knowledge','独自知見']];
const seedById=Object.fromEntries(SEED.cancers.map(x=>[x.id,x]));
const sourceMap=Object.fromEntries(SEED.sources.map(x=>[x.id,x]));
const CLINICAL=SEED.clinicalNotes||[];
let articleId=null;let articleBack=null;

let notesFilter="all";
const emptyCancer = (name,group,id)=>({id,name,group,aliases:[],status:'skeleton',summary:'新規登録。治療情報は未登録です。',topics:[],regimens:[],oar:[],systemic:[],toxicity:[],outcomes:[],guidance:[],local:''});
const defaultStore={customCancers:[],memos:[],caseRecords:[],knowledgeEntries:[],reviewOverrides:{},audit:[],favorites:['prostate','nsclc'],theme:'light',modified:''};
let store=readStore(),current=location.hash==='#breast'?'breast':'prostate',tab='pathways',oarRegime='all',oarOrgan='all',allSources=false,searchTimer;
function readStore(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object'){return {...defaultStore,...v,customCancers:Array.isArray(v.customCancers)?v.customCancers:[],memos:Array.isArray(v.memos)?v.memos.map(m=>m.cancer==='glioma'?{...m,cancer:'gbm'}:m):[],favorites:Array.isArray(v.favorites)?v.favorites.map(id=>id==='glioma'?'gbm':id):[],caseRecords:Array.isArray(v.caseRecords)?v.caseRecords:[],knowledgeEntries:Array.isArray(v.knowledgeEntries)?v.knowledgeEntries:[],audit:Array.isArray(v.audit)?v.audit:[],reviewOverrides:v.reviewOverrides&&typeof v.reviewOverrides==='object'?v.reviewOverrides:{}};}}catch{}return structuredClone(defaultStore)}
function persist(){store.modified=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){flash('保存できませんでした。容量やブラウザ設定を確認してください。')}}
function cancers(){return [...SEED.cancers,...store.customCancers]}
function getCancer(id=current){return cancers().find(x=>x.id===id)||SEED.cancers[0]}
function escapeH(str=''){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function textLines(str){return escapeH(str).replace(/\n/g,'<br>')}
function safeURL(u){try{let x=new URL(u);return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch{return ''}}
function statusPill(status){return status==='expanded'?'<span class="pill good">重点整備</span>':status==='partial'?'<span class="pill warn">一部整備</span>':'<span class="pill">情報未整備</span>'}
function refsHtml(ids){if(!Array.isArray(ids)||!ids.length)return '<span class="ref empty">院内検討・根拠未照合</span>';return ids.map(id=>{let s=sourceMap[id];return s?`<a class="ref" target="_blank" rel="noopener noreferrer" href="${escapeH(safeURL(s.url))}" title="${escapeH(s.title)}">↗ ${escapeH(s.title.slice(0,16))} · ${escapeH(s.year.slice(0,4))}</a>`:''}).join('')}
function flash(message){let t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),3000)}
function button(label,handler,cls='btn'){return `<button class="${cls}" data-act="${handler}">${label}</button>`}
function navigate(id,t='pathways'){if(location.hash.startsWith('#article/'))history.replaceState(null,'','#');articleId=null;current=id;tab=t;oarRegime='all';oarOrgan='all';pathStage='all';pathPurpose='all';pathQuery='';document.getElementById('search').value='';document.getElementById('searchResults').classList.remove('show');closeSidebar();render();window.scrollTo({top:0,behavior:'instant'})}

function toggleFav(){let i=store.favorites.indexOf(current);if(i>=0)store.favorites.splice(i,1);else store.favorites.push(current);persist();render()}
function renderSidebar(){const g=Object.groupBy?Object.groupBy(cancers(),x=>x.group):cancers().reduce((a,x)=>((a[x.group]??=[]).push(x),a),{});const order=['胸部','泌尿器','乳腺','中枢神経','消化器','頭頸部','婦人科','血液','転移・緩和','その他'];let html='<div class="section-label">QUICK ACCESS</div>'+`<button class="side-item ${current==='_library'?'active':''}" data-nav="_library">▦　全癌種・文献一覧</button>`+`<button class="side-item ${current==='_oarall'?'active':''}" data-nav="_oarall">◎　横断OAR制約</button>`+`<button class="side-item ${current==='_cases'?'active':''}" data-nav="_cases">▣　症例検討メモ</button>`+`<button class="side-item ${current==='_reviews'?'active':''}" data-nav="_reviews">↻　更新履歴・見直し</button>`+`<button class="side-item ${current==='_clinical'?'active':''}" data-nav="_clinical">▤　診療プロジェクト知見 <span class="tiny-dot expanded"></span></button>`+`<a class="side-item" href="./clinical-calculators.html" style="text-decoration:none">∑　臨床計算ツール <span class="tiny-dot expanded"></span></a><a class="side-item" href="./dose-calculator.html" style="text-decoration:none">◉　線量・BED・EQD2計算 <span class="tiny-dot expanded"></span></a>`;let favs=cancers().filter(x=>store.favorites.includes(x.id));if(favs.length){html+='<div class="section-label">お気に入り</div>';html+=favs.map(x=>`<button class="side-item ${x.id===current?'active':''}" data-nav="${escapeH(x.id)}"><span>☆　${escapeH(x.name)}</span><span class="tiny-dot ${x.status}"></span></button>`).join('')};for(const group of order){if(!g[group]?.length)continue;html+=`<div class="section-label">${escapeH(group)}</div>`;html+=g[group].map(x=>`<button class="side-item ${x.id===current?'active':''}" data-nav="${escapeH(x.id)}"><span>${escapeH(x.name)}</span><span class="tiny-dot ${escapeH(x.status)}"></span></button>`).join('')}document.getElementById('sidenav').innerHTML=html}
function render(){renderSidebar();renderContent()}
function renderContent(){const area=document.getElementById('content');if(current==='_library'){area.innerHTML=renderLibrary();return}if(current==='_clinical'){area.innerHTML=renderClinicalIndex();return}if(current==='_article'){area.innerHTML=renderArticleDetail();return}if(current==='_oarall'){area.innerHTML=renderOARGlobal();return}if(current==='_cases'){area.innerHTML=renderCases();return}if(current==='_reviews'){area.innerHTML=renderReviews();return}const x=getCancer();let fav=store.favorites.includes(x.id);let inner=`<div class="kicker">RADIATION ONCOLOGY · ${escapeH(x.group)}</div><div class="head"><div><h1 class="page-title">${escapeH(x.name)}</h1><p class="description">${escapeH(x.summary)}</p></div><div class="head-actions">${button(fav?'★ お気に入り':'☆ お気に入り','favorite')}${button('＋ 検討メモ','addMemo','btn primary')}</div></div><div class="badges">${statusPill(x.status)}${x.topics.map(y=>`<span class="pill blue">${escapeH(y)}</span>`).join('')}</div><div class="notice">⚠️ <b>診療の最終判断には使用条件と原典確認が必要です。</b> 数値は分割・輪郭定義・照射条件に依存します。「施設検討」はガイドライン推奨ではありません。収録データ最終点検：2026-11-12（個別項目の確認日も表示）。</div>`;if(x.id==='breast')inner+=`<section class="panel" style="border:1px solid #a1d6ce;background:var(--teal-light);margin:12px 0 18px"><div class="kicker">INTERACTIVE CLINICAL TOOL / BETA</div><h2 class="panel-title" style="margin-bottom:6px">乳癌術後：照射する部位の決定</h2><p class="minor">日本のガイドラインを優先し、全乳房・胸壁・鎖骨上・腋窩・内胸・ブーストの採否を一画面で提示。未確定の項目と判断理由も表示します。</p><a class="btn primary" href="breast-field-planner.html" style="text-decoration:none;display:inline-flex">照射部位を決める ↗</a><p class="minor muted" style="margin:7px 0 0">日本2022公開本文に基づく判定案。日本2026年版は刊行済みですが推奨本文未照合。</p></section>`;inner+=`<nav class="tabs" aria-label="項目">${TABS.map(([k,v])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</nav>`;if(tab==='pathways')inner+=renderRtJastro(x)+viewPathways(x);if(tab==='overview')inner+=viewOverview(x);if(tab==='regimens')inner+=viewRegimens(x);if(tab==='oar')inner+=viewOAR(x);if(tab==='systemic')inner+=viewFromPaths(x,'systemic','病期別の併用薬物療法');if(tab==='toxicity')inner+=viewFromPaths(x,'adverse','病期別の有害事象・対処');if(tab==='outcomes')inner+=viewFromPaths(x,'outcome','原典付きの予後・治療成績')+viewOutcomes(x);if(tab==='refs')inner+=viewRefs(x);if(tab==='notes')inner+=viewNotes(x);if(tab==='differences')inner+=viewDifferences(x);if(tab==='knowledge')inner+=viewKnowledge(x);inner+=viewClinicalNotes(x.id,(tab==='notes'||tab==='overview')?'all':tab);area.innerHTML=inner+`<div class="foot">RT Reference β v0.5.4 · 参考情報・臨床判断補助。患者情報・個人識別情報は入力しないでください。<br>検索とメモは端末内で動作し、外部AI・病院システムとの同期はありません。原典の著作権に配慮し、要約とリンクを掲載しています。</div>`}

function isRt60Regimen(x,r){
 return x===seedById.prostate && x.regimens.includes(r) &&
  r.label==='局所限局癌・根治EBRT' && r.dose==='60 Gy / 20 fr' &&
  r.kind==='標準・文献' && r.refs?.includes('chhip16');
}
function isRt60Pathway(x,r){
 return x===seedById.prostate && r.id==='p001' && EVIDENCE.pathways.includes(r) &&
  x.regimens.some(item=>isRt60Regimen(x,item));
}

 <section><div class="rt60-section-label">ターゲット</div><h4>標的とマージン</h4><dl><div><dt>GTV</dt><dd>画像・診察などで同定する肉眼的病変。画像上の病変範囲をそのままCTVとはしません。</dd></div><div><dt>CTV</dt><dd>前立腺全体を基本に、精嚢や被膜外進展への範囲を病期・リスク・画像所見に応じて確認します。</dd></div><div><dt>PTV</dt><dd>CTVに位置合わせ誤差と臓器移動を考慮したマージンを設定。固定・IGRT・施設内の検証条件を確認します。</dd></div></dl>
 <details class="rt60-protocol"><summary>CHHiP試験の標的・マージン（参考）</summary><p>試験のGTVは前立腺と定義。高線量標的PTV3（60.0 Gy）は、CTV3（前立腺）に5 mmを加え、直腸側は0 mmとしたものです。57.6 GyのPTV2、48.0 GyのPTV1は別の入れ子状の標的です。</p><p class="rt60-small">上記はCHHiPの試験定義で、院内値ではありません。${appendix}</p></details></section>

 <div class="rt60-wilkins"><span class="rt60-tag">毒性解析からの提案</span><h5>直腸肛門（anorectum）</h5><p><strong>肛門縁から直腸S状結腸移行部までの全体</strong></p><p class="rt60-small">Wilkinsら。60 Gy／20回・57 Gy／19回の統合解析。Vxはx Gy以上を受ける相対体積（%）。</p>

 <details class="rt60-protocol"><summary>CHHiP試験プロトコール（直腸・膀胱）</summary><p class="rt60-small">60 Gy／20回のプロトコール制約。上記のWilkinsらによる提案とは別です。</p>

function isRtSibRegimen(x,r){
 return x===seedById.prostate && x.regimens.includes(r) && r.label==='骨盤SIB・院内臨床運用' &&
  r.dose==='前立腺 60 Gy / 20 fr ＋ 骨盤LN 44–47 Gy / 20 fr' && r.kind==='院内運用（担当医確認）';
}
function isRtSibPathway(x,r){
 return x===seedById.prostate && r.id==='p003' && EVIDENCE.pathways.includes(r) &&
  x.regimens.some(item=>isRtSibRegimen(x,item));
}
function renderPelvicBowelReferences(){
 return `<section class="pelvic-bowel-refs"><div class="rt60-section-label">文献の計画時参考値 · 院内基準とは別</div><h4>小腸ループと腸管腔を別々に評価</h4>
 <h5>小腸ループ（Small bowel loops）</h5><p>計画CTに見える小腸ループを描出し、大腸や腸管が移動し得る空間は含めません。NRGの骨盤リンパ節アトラス表1の前立腺60 Gy／20回＋骨盤44–47 Gy／20回欄の参考値です。</p>
 <ul><li>Dmax ≤40 Gy</li><li>V37 Gy ≤90 cc</li><li>V33 Gy ≤130 cc</li></ul><p class="rt60-small">同表のDmaxをD0.03 ccに置き換えません。<a href="https://www.nrgoncology.org/wp-content/uploads/2025/09/Hall-IJROBP-2021-Updated-International-Consensus-Atlas-on-Pelvic-Lymph-Node-Volumes.pdf" target="_blank" rel="noopener noreferrer">NRG Oncology アトラス：表1</a></p>
 <h5>腸管腔（Bowel cavity／bowel bag）</h5><p>小腸・大腸が存在し得る腹膜腔を評価する構造で、描出したループの合計とは別です。前立腺60 Gy／20回＋骨盤44 Gy／20回の単施設報告が、bowel bagに用いた値です。</p>
 <ul><li>V45 Gy &lt;200 cc</li><li>D5 cc &lt;60 Gy</li></ul><p class="rt60-small">44 Gyの報告上の計画条件で、骨盤47 Gyや院内輪郭への一律適用は未確認です。研究の記載からは輪郭の細かな境界を特定できません。<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10547407/#s2" target="_blank" rel="noopener noreferrer">単施設報告：Materials and methods</a> ／ <a href="https://www.nrgoncology.org/wp-content/uploads/2025/09/RT-section-Protocol-Prostate-Treatment-Template-update-v.2.4.2025-FINAL_updated.pdf" target="_blank" rel="noopener noreferrer">輪郭の参考：NRG試験テンプレート §5.2.5</a></p>
 <p class="rt60-small">Vxはx Gy以上を受ける体積。D5 ccは高線量側5 ccの最小線量。異なる輪郭の制約や、従来の院内Bowel表を相互に流用しません。</p></section>`;
}

 <section><div class="rt60-section-label">院内運用（担当医確認）</div><h4>適応・標的・処方</h4><p>超高リスク・N1・一部高リスクで個別判断。前立腺・精嚢、予防骨盤リンパ節、陽性リンパ節を区別して輪郭化します。</p>
 <table aria-label="院内の骨盤SIB 線量"><thead><tr><th scope="col">標的</th><th scope="col">20回の総線量</th></tr></thead><tbody><tr><th scope="row">前立腺</th><td>60 Gy</td></tr><tr><th scope="row">予防骨盤LN</th><td>44–47 Gy</td></tr><tr><th scope="row">陽性LN増量（候補）</th><td>51 Gy</td></tr></tbody></table><p class="rt60-small">陽性LNの増量は一律ではありません。長期ADTなどの併用は個別に検討します。</p></section>
 <section><div class="rt60-section-label">院内計画基準 · 骨盤SIB 20回</div><h4>腸管（Bowel）の線量制約</h4>
 <p>前立腺60 Gy／20回＋予防骨盤リンパ節44–47 Gy／20回を同時照射する場合。計画の努力目標と必須制約を分けて表示します。</p>
 <table aria-label="骨盤SIB 20回の院内腸管線量制約"><thead><tr><th scope="col">指標</th><th scope="col">努力目標</th><th scope="col">必須制約</th></tr></thead><tbody>
 <tr><th scope="row">V40 Gy</th><td>≤17 cc</td><td>≤70 cc</td></tr>
 <tr><th scope="row">V48 Gy</th><td>≤0.5 cc</td><td>≤6 cc</td></tr>
 <tr><th scope="row">V52 Gy</th><td>0 cc</td><td>0 cc</td></tr></tbody></table>
 <p class="rt60-small">Vxはx Gy以上を受ける体積（cc）。参照したEast Midlandsのプロトコルは、小腸と大腸を直腸まで描出し、頭側はPTV上端の2 cm上までに絞ることを検討する定義です。院内で用いる輪郭の詳細は確認し、腸管腔（bowel bag）や小腸ループ単独に同値を流用しません。局所照射のCHHiP・Wilkins値は別扱いです。</p>

/* Explicit disease scope and exact seeded regimen/pathway matching. Never infer OAR limits. */
function rtClinicalSite(x){
 const data=typeof window==='object'?window.RT_CLINICAL:null;
 return x?.id && data && Object.hasOwn(data,x.id)?data[x.id]:null;
}
function rtClinicalMatch(x,r,kind,site){
 if(!Array.isArray(site?.regimens)||x!==seedById[x?.id]||!r||typeof r.dose!=='string'||!r.dose)return null;
 if(kind==='regimen'&&(!x.regimens.includes(r)||x.regimens.filter(item=>item.label===r.label&&item.dose===r.dose).length!==1))return null;
 if(kind==='pathway'&&(!EVIDENCE.pathways.includes(r)||r.cancer!==x.id||EVIDENCE.pathways.filter(item=>item.id===r.id).length!==1))return null;
 const matches=site.regimens.filter(entry=>{
  const m=entry?.match;
  if(kind==='regimen')return typeof m?.label==='string'&&m.label!==''&&m.label===r.label&&m.dose===r.dose;
  if(kind==='pathway')return typeof m?.pathwayId==='string'&&m.pathwayId!==''&&m.pathwayId===r.id&&m.pathwayDose===r.dose&&(!m.pathwayTitle||m.pathwayTitle===r.title);
  return false;
 });
 if(matches.length!==1)return null;
 const entry=matches[0];
 return Array.isArray(entry.sections)&&entry.sections.some(section=>Array.isArray(section?.refs)&&section.refs.some(ref=>rtClinicalRef(ref)))?entry:null;
}
function rtClinicalRef(ref){
 if(typeof ref?.label!=='string'||!ref.label.trim()||typeof ref.url!=='string')return '';
 try {
  const url=new URL(ref.url);
  if(url.protocol!=='https:'||url.username||url.password)return '';
  return `<a href="${en(url.href)}" target="_blank" rel="noopener noreferrer">${en(ref.label)}</a>`;
 } catch{return ''}
}
function rtClinicalBody(content){
 const str=v=>typeof v==='string'?en(v):'';
 const sections=(Array.isArray(content?.sections)?content.sections:[]).map(section=>{
  const items=(Array.isArray(section?.items)?section.items:[]).map(str).filter(Boolean);
  const refs=(Array.isArray(section?.refs)?section.refs:[]).map(rtClinicalRef).filter(Boolean);
  return `${str(section?.title)?`<h4>${str(section.title)}</h4>`:''}${str(section?.text)?`<p>${str(section.text)}</p>`:''}${items.length?`<ul>${items.map(item=>`<li>${item}</li>`).join('')}</ul>`:''}${refs.length?`<ul aria-label="原典">${refs.map(ref=>`<li>${ref}</li>`).join('')}</ul>`:''}`;
 }).join('');
 return (str(content?.summary)?`<p>${str(content.summary)}</p>`:'')+sections;
}

/* Published guideline summaries; exact section links are required to render a plan. */
function renderRtJastro(x){
 if(!x?.id || x!==seedById[x.id])return '';
 const data=window.RT_JASTRO;
 const raw=data&&Object.hasOwn(data,x.id)?data[x.id]:null;
 if(!Array.isArray(raw))return '';
 const fields=[['indication','適応'],['dose','線量・分割'],['gtv','GTV'],['ctv','CTV'],['ptv','PTV'],['oar','OAR'],['notes','適用上の注意']];
 const clean=v=>typeof v==='string'?v.trim():'';
 const plans=raw.flatMap(plan=>{
  const setting=clean(plan?.setting);
  const sources=(Array.isArray(plan?.sources)?plan.sources:[]).map(ref=>{
   if(typeof ref?.url!=='string')return '';
   try{if(!['jastro.or.jp','www.jastro.or.jp'].includes(new URL(ref.url).hostname))return ''}catch{return ''}
   return rtClinicalRef(ref);
  }).filter(Boolean);
  const extra=(Array.isArray(plan?.supplementSources)?plan.supplementSources:[]).map(rtClinicalRef).filter(Boolean);
  const rows=fields.flatMap(([key,label])=>{
   const value=clean(plan?.[key]);
   return value?[`<div><dt>${label}</dt><dd>${en(value)}</dd></div>`]:[];
  });
  return setting&&sources.length&&rows.length?[`<article class="jastro-plan"><h3>${en(setting)}</h3><dl>${rows.join('')}</dl><ul class="jastro-links" aria-label="JASTRO 2024 原典">${sources.map(link=>`<li>${link}</li>`).join('')}</ul>${extra.length?`<ul class="jastro-links" aria-label="別資料による補足"><li><strong>別資料による補足</strong></li>${extra.map(link=>`<li>${link}</li>`).join('')}</ul>`:''}</article>`]:[];
 });
 if(!plans.length)return '';
 return `<details class="jastro-clinical"><summary>診療要点｜JASTRO 2024 <span class="jastro-count">${plans.length}項目</span></summary><div class="jastro-body"><p class="minor muted">放射線治療計画ガイドライン2024年版をもとにした治療場面別の要約。各項目の対象・条件と原典を照合し、個別症例や別の分割に自動適用しません。</p>${plans.join('')}</div></details>`;
}

function renderRtClinical(x,r=null,kind='site'){
 const site=rtClinicalSite(x);
 const context=rtClinicalBody(site?.context);
 if(kind==='site'&&!context)return '';
 const exact=kind==='site'?null:rtClinicalMatch(x,r,kind,site);
 const contextNote='<p class="rt-clinical-scope">疾患全体の参考情報（個別処方の根拠・制約ではありません）</p>';
 if(kind==='site')return `<details class="rt-clinical"><summary>疾患全体の臨床情報</summary><div class="rt-clinical-body">${contextNote}${context}</div></details>`;
 const detail=exact?'<p class="rt-clinical-scope">この掲載処方に対応する補足情報</p>'+rtClinicalBody(exact):'<p class="rt-clinical-scope">この個別処方の追加詳細は未確認・未収載</p><p>処方固有の適応、マージン、OAR制約、成績は他の病期・分割・照射範囲から補いません。掲載済みの原典と施設基準を確認してください。</p>';

}

function viewRegimens(x){let items=x.regimens||[];return `<div class="panel"><h2 class="panel-title">処方線量・分割回数 <span class="pill">${items.length}件</span></h2><p class="panel-sub">ガイドライン・臨床試験の情報と、施設独自の検討は別扱い</p><div class="info-banner blue-banner">処方の適否は病期、照射目的、併用療法、既照射歴、PTV/OAR条件で変わります。ここにない値を自動補完しません。</div>${renderRtClinical(x)}${items.length?`<div class="info-grid">${items.map(r=>`<article class="regimen ${r.kind?.startsWith('院内')?'local':''}"><div class="label">${escapeH(r.label)}</div>${isRt60Regimen(x,r)?renderRt60Detail():isRtSibRegimen(x,r)?renderRtSibDetail():`<div class="value">${escapeH(r.dose)}</div>${renderRtClinical(x,r,'regimen')}`}<div class="detail">${escapeH(r.detail)}</div>${r.note?`<div class="dose-note" style="margin-top:7px;color:var(--orange)">${escapeH(r.note)}</div>`:''}<div class="bottom">${r.kind==='標準・文献'?'<span class="pill good mini">文献出典あり</span>':isRtSibRegimen(x,r)?'<span class="pill blue mini">院内運用（担当医確認）</span>':'<span class="pill warn mini">施設検討・未承認</span>'}${isRtSibRegimen(x,r)?'':refsHtml(r.refs)}<div class="minor muted">確実性：${en(r.certainty||'要評価')} · 発行年：${en((r.refs||[]).map(id=>sourceMap[id]?.year||'').join('/'))} · 最終確認：${en(r.checked||'未確認')} · 見直し：${en(r.reviewDue||'未設定')}</div></div></article>`).join('')}</div>`:'<div class="empty">この癌種の処方線量一覧は未登録です。病期別・処方に掲載済みの項目があれば、そちらの処方詳細を確認できます。未検証の数値は表示していません。<br><button class="btn" data-tab="pathways">病期別・処方を開く</button></div>'}</div>`}
function viewOAR(x){let list=x.oar||[],regimes=[...new Set(list.map(x=>x.regime))],organs=[...new Set(list.map(x=>x.organ))],filtered=list.filter(i=>(oarRegime==='all'||i.regime===oarRegime)&&(oarOrgan==='all'||i.organ===oarOrgan));return `${x===seedById.prostate?`<div class="panel"><h2 class="panel-title">骨盤SIB 20回のOAR</h2>${renderPelvicBowelReferences()}</div>`:""}<section class="panel"><h2 class="panel-title">OAR線量制約 <span class="pill">${list.length}項目</span></h2><div class="info-banner warn-banner"><b>重要：</b>Vxの定義、%とcc、輪郭（臓器全体/壁）、線量計算法、分割回数、目標値の強さ（protocol / proposal / reference）を必ず確認してください。特にSBRTや再照射へ転用しないでください。</div>${list.length?`<div class="filters"><select id="filterRegime" aria-label="分割別フィルター"><option value="all">すべての分割</option>${regimes.map(k=>`<option value="${escapeH(k)}" ${oarRegime===k?'selected':''}>${escapeH(k)}</option>`).join('')}</select><select id="filterOrgan" aria-label="臓器別フィルター"><option value="all">すべての臓器</option>${organs.map(k=>`<option value="${escapeH(k)}" ${oarOrgan===k?'selected':''}>${escapeH(k)}</option>`).join('')}</select></div><div class="table-scroll"><table><thead><tr><th>臓器</th><th>分割・条件</th><th>指標</th><th>制約・目標</th><th>由来・適用条件</th><th>出典</th></tr></thead><tbody>${filtered.map(v=>`<tr><td><strong>${escapeH(v.organ)}</strong></td><td>${escapeH(v.regime)}</td><td><b>${escapeH(v.metric)}</b></td><td><strong>${escapeH(v.goal)}</strong></td><td><span class="pill mini ${v.level.includes('提案')?'warn':'blue'}">${escapeH(v.level)}</span>${v.note?`<p class="minor muted">${escapeH(v.note)}</p>`:''}</td><td>${refsHtml(v.refs)}</td></tr>`).join('')}</tbody></table></div>${filtered.length?'':'<div class="empty">条件に合う制約はありません</div>'}`:'<div class="empty">この癌種の制約値はまだ登録していません。数値の推測表示はしません。</div>'}</section>`}

function renderLibrary(){let cs=cancers();let summary=cs.map(x=>`<button class="side-item" style="color:var(--ink);background:var(--surface);border:1px solid var(--stroke);padding:14px;border-radius:12px;min-height:75px" data-nav="${escapeH(x.id)}"><span><b>${escapeH(x.name)}</b><br><small class="muted">${escapeH(x.group)}　·　処方${x.regimens.length} / OAR${x.oar.length}</small></span><span class="tiny-dot ${x.status}"></span></button>`).join('');return `<div class="kicker">LIBRARY / ALL TOPICS</div><div class="head"><div><h1 class="page-title">癌種・情報源一覧</h1><p class="description">登録済み癌種を開いて参照。新しい癌種や個別検討を追加できます。</p></div><div class="head-actions">${button('＋ 癌種追加','addCancer','btn primary')}</div></div><div class="stats"><div class="stat"><span>登録癌種</span><strong>${cs.length}</strong></div><div class="stat"><span>OAR制約</span><strong>${cs.reduce((s,x)=>s+x.oar.length,0)}</strong></div><div class="stat"><span>処方候補</span><strong>${cs.reduce((s,x)=>s+x.regimens.length,0)}</strong></div><div class="stat"><span>文献・資料</span><strong>${SEED.sources.length}</strong></div></div><div class="panel"><h2 class="panel-title">診療プロジェクトからの整理</h2><p class="minor muted">過去の医療系チャットから、識別情報を除いた臨床上の論点を${CLINICAL.length}件収録。各ノートに参考文献や要照合のラベルを付けています。</p><button class="btn primary" data-nav="_clinical">↗ 診療ノートの一覧を見る</button></div><div class="panel"><h2 class="panel-title">横断検索・管理</h2><div class="quick-nav"><button data-nav="_oarall">OARの分割数別検索</button><button data-nav="_cases">症例別メモ</button><button data-nav="_reviews">更新履歴・見直し</button></div></div><div class="panel"><h2 class="panel-title">癌種一覧 ${button('＋ 追加','addCancer','btn small')}</h2><div class="info-grid">${summary}</div></div><div class="panel"><h2 class="panel-title">初期収録の情報源</h2><p class="panel-sub">JASTRO、ASTRO、ESTROのガイドラインと、日本・欧米の査読付き論文。</p>${SEED.sources.map(sourceCard).join('')}</div><div class="panel"><h2 class="panel-title">データの管理</h2><p class="minor muted">癌種追加・個人メモはブラウザの端末内保存です。公開資料の医学データはアプリ本体を更新して反映します。自動監視・自動同期は未実装です。</p><div style="display:flex;gap:8px;flex-wrap:wrap">${button('↓ JSONバックアップ','export')}${button('↑ JSON復元','import')}${button('保存データを初期化','reset','btn danger')}</div></div><div class="foot">最終データ確認：2026-11-12 ・ 医療従事者の確認を前提としたベータ版</div>`}

function modalCancer(){openModal(`<form id="formCancer"><h2>癌種を追加</h2><p>共通タブを持つ新しい癌種を追加します。最初は未整備状態です。</p><div class="field"><label for="cName">癌種名 *</label><input id="cName" maxlength="65" required placeholder="例：胆道癌"></div><div class="field"><label for="cGroup">分類</label><select id="cGroup">${['胸部','泌尿器','乳腺','中枢神経','消化器','頭頸部','婦人科','血液','転移・緩和','その他'].map(g=>`<option value="${g}">${g}</option>`).join('')}</select></div><div class="dialog-actions"><button class="btn" type="button" data-act="closeModal">キャンセル</button><button class="btn primary" type="submit">登録する</button></div></form>`);document.getElementById('formCancer').addEventListener('submit',e=>{e.preventDefault();let n=document.getElementById('cName').value.trim(),g=document.getElementById('cGroup').value;if(!n||cancers().some(x=>x.name===n)){flash('空欄または同名の癌種は登録できません');return}let id='custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);store.customCancers.push(emptyCancer(n,g,id));persist();closeModal();navigate(id);flash('癌種を追加しました')})}
function modalMemo(){let xs=cancers();openModal(`<form id="formMemo"><h2>検討メモを追加</h2><p>出典・検討状況を添えて端末内に保存します。未検証メモとして表示されます。</p><div class="field"><label for="mCancer">癌種</label><select id="mCancer">${xs.map(x=>`<option value="${escapeH(x.id)}" ${x.id===current?'selected':''}>${escapeH(x.name)}</option>`).join('')}</select></div><div class="field"><label for="mType">分類</label><select id="mType"><option>臨床検討（未検証）</option><option>論文メモ（未検証）</option><option>院内プロトコール案（未承認）</option><option>有害事象メモ（未検証）</option></select></div><div class="field"><label for="mTitle">タイトル *</label><input id="mTitle" maxlength="150" required placeholder="例：前立腺骨盤SIBの検討"></div><div class="field"><label for="mBody">内容 *</label><textarea id="mBody" maxlength="12000" required placeholder="患者を識別できる情報は入力しないでください"></textarea></div><div class="field"><label for="mUrl">原典URL（任意・https://）</label><input id="mUrl" type="url" placeholder="https://..."></div><div class="dialog-actions"><button class="btn" type="button" data-act="closeModal">キャンセル</button><button class="btn primary" type="submit">保存する</button></div></form>`);document.getElementById('formMemo').addEventListener('submit',e=>{e.preventDefault();let cancer=document.getElementById('mCancer').value,title=document.getElementById('mTitle').value.trim(),body=document.getElementById('mBody').value.trim(),url=document.getElementById('mUrl').value.trim();if(!title||!body)return;if(url&&!safeURL(url)){flash('URLはhttp(s)で入力してください');return}store.memos.unshift({id:'memo_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),cancer,title,body,url,type:document.getElementById('mType').value,created:new Date().toISOString()});persist();closeModal();navigate(cancer,'notes');flash('メモを端末内に保存しました')})}
function exportData(){let data={schema:'RTReferenceUserData',schemaVersion:2,exportedAt:new Date().toISOString(),data:{customCancers:store.customCancers,memos:store.memos,favorites:store.favorites,caseRecords:store.caseRecords,knowledgeEntries:store.knowledgeEntries,reviewOverrides:store.reviewOverrides,audit:store.audit}};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rt-reference-user-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);flash('バックアップJSONを出力しました（保管に注意）')}
function importData(){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let file=f.files[0];if(!file)return;if(file.size>8e6)throw Error('ファイルサイズが8MBを超えています');let z=JSON.parse(await file.text());if(z.schema!=='RTReferenceUserData'||![1,2].includes(z.schemaVersion)||!z.data||!Array.isArray(z.data.customCancers)||!Array.isArray(z.data.memos))throw Error('対応するRT Referenceバックアップではありません');if(!confirm('端末内の追加癌種・全メモ・確認記録をバックアップで置き換えます。よろしいですか？'))return;let v=z.data;if(v.customCancers.length>500||v.memos.length>2000||(v.caseRecords||[]).length>1000||(v.knowledgeEntries||[]).length>2000)throw Error('データ件数が多すぎます');for(let c of v.customCancers){if(!c.id||!c.name||typeof c.name!=='string'||c.name.length>65||!/^custom_/.test(c.id))throw Error('癌種データが不正です')}for(let m of v.memos){if(!m.id||typeof m.body!=='string'||m.body.length>12000||typeof m.title!=='string'||m.title.length>150)throw Error('メモデータが不正です')}store.customCancers=v.customCancers.map(c=>({...emptyCancer(c.name,String(c.group||'その他').slice(0,60),c.id)}));store.memos=v.memos.map(m=>({id:String(m.id).slice(0,90),cancer:String(m.cancer||''),title:String(m.title),body:String(m.body),type:String(m.type||'臨床検討（未検証）').slice(0,80),url:safeURL(m.url),created:String(m.created||new Date().toISOString()).slice(0,60)}));store.caseRecords=Array.isArray(v.caseRecords)?v.caseRecords.map(r=>({id:String(r.id||'').slice(0,100),code:String(r.code||'').slice(0,60),cancer:String(r.cancer||'').slice(0,70),stage:String(r.stage||'').slice(0,120),body:String(r.body||'').slice(0,8000),todo:String(r.todo||'').slice(0,4000),status:String(r.status||'検討中').slice(0,30),reviewDue:String(r.reviewDue||'').slice(0,10),created:String(r.created||'').slice(0,10),updated:String(r.updated||'').slice(0,10)})):[];store.knowledgeEntries=Array.isArray(v.knowledgeEntries)?v.knowledgeEntries.filter(r=>r&&typeof r==='object'&&String(r.id||'').startsWith('k_')).map(r=>({...r,body:String(r.body||'').slice(0,10000),title:String(r.title||'').slice(0,150),sourceUrl:safeURL(r.sourceUrl),refs:[]})):[];store.reviewOverrides=(v.reviewOverrides&&typeof v.reviewOverrides==='object')?v.reviewOverrides:{};store.audit=Array.isArray(v.audit)?v.audit.slice(0,300):[];store.favorites=Array.isArray(v.favorites)?v.favorites.filter(s=>typeof s==='string').slice(0,80):[];audit('ユーザーバックアップを復元');persist();current='_library';render();flash('バックアップを復元しました')}catch(e){flash('読み込み失敗：'+e.message)}};f.click()}
function resetData(){if(confirm('この端末に保存した追加癌種・全メモ・症例・履歴をすべて消去します。よろしいですか？')){store=structuredClone(defaultStore);persist();current='_library';render();flash('端末内の追加データを初期化しました')}}
function delMemo(id){if(confirm('このメモを削除しますか？')){store.memos=store.memos.filter(x=>x.id!==id);persist();renderContent();flash('削除しました')}}
function normalize(s){return String(s).toLowerCase().normalize('NFKC').replace(/[\s　]+/g,'').replace(/gy/g,'gy')}
function searchRecords(q){let terms=q.trim().split(/\s+/).map(normalize).filter(Boolean);if(!terms.length)return[];let result=cancers().map(x=>{let related=CLINICAL.filter(n=>n.cancer===x.id);let sections=[['oar',JSON.stringify(x.oar)],['regimens',JSON.stringify(x.regimens)],['toxicity',JSON.stringify(x.toxicity)],['systemic',JSON.stringify(x.systemic)],['outcomes',JSON.stringify(x.outcomes)],['notes',x.local+' '+store.memos.filter(m=>m.cancer===x.id).map(m=>m.title+' '+m.body).join(' ')],...['overview','regimens','oar','systemic','toxicity','outcomes'].map(k=>[k,JSON.stringify(related.filter(n=>n.section===k))])];let basic=normalize([x.name,x.group,x.summary,...x.aliases,...x.topics].join(' '));let all=normalize([basic,...sections.map(y=>y[1])].join(' '));if(!terms.every(term=>all.includes(term)))return null;let matched=related.find(n=>terms.every(term=>normalize(JSON.stringify(n)).includes(term)));let best=matched?.section||sections.find(([k,v])=>terms.some(t=>normalize(v).includes(t)))?.[0]||'overview';return {x,tab:best,note:matched,score:terms.reduce((n,t)=>n+(basic.includes(t)?10:1),0)+(matched?3:0)}}).filter(Boolean);let clinical=CLINICAL.filter(n=>n.cancer==='general'&&terms.every(t=>normalize(JSON.stringify(n)).includes(t)));if(clinical.length){let n=clinical[0];result.push({x:{id:'_clinical',name:'診療一般',group:'診療一般',summary:n.title},tab:'notes',note:n,score:6})}return result.sort((a,b)=>b.score-a.score).slice(0,18)}
function updateSearch(){let input=document.getElementById('search'),v=input.value.trim(),res=document.getElementById('searchResults');if(!v){res.classList.remove('show');return}let items=searchRecords(v);let matches=[...EVIDENCE.pathways,...(store.knowledgeEntries||[]).filter(z=>z.section==='pathways')].filter(r=>v.trim().split(/\s+/).every(t=>normalize(JSON.stringify(r)).includes(normalize(t)))).slice(0,8);res.innerHTML=(items.length||matches.length)?matches.map(r=>`<button class="search-row" data-search-go="${en(r.cancer)}" data-search-tab="pathways"><b>${en(cancers().find(c=>c.id===r.cancer)?.name)} · ${en(r.title)}</b><small>${en(r.stage)} / ${en(r.dose)} · 確実性 ${en(r.certainty)}</small></button>`).join('')+items.map(z=>`<button class="search-row" data-search-go="${escapeH(z.x.id)}" data-search-tab="${escapeH(z.tab)}" data-search-note="${escapeH(z.note?.id||'')}"><b>${escapeH(z.x.name)}</b><small>${escapeH(z.note?.title||z.x.group+' ／ '+(TABS.find(t=>t[0]===z.tab)?.[1]||'概要')+' ／ '+z.x.summary.slice(0,60))}</small></button>`).join(''):'<div class="empty">該当する項目がありません。癌種・略語・線量指標で再検索してください。</div>';res.classList.add('show')}

/* v0.4 structured evidence pathways, regional differences, longitudinal reviews */
const EVIDENCE=window.RT_EVIDENCE || {pathways:[],oar:[],differences:[]};
let pathStage='all',pathPurpose='all',pathQuery='',globalOarCancer='all',globalOarFx='all',globalOarIntent='all',globalOarOrgan='all',globalOarQuery='';
const nowISO=()=>new Date().toISOString().slice(0,10);
const en=(v)=>escapeH(v??'');
const safeKey=id=>String(id).replace(/[^a-z0-9_-]/gi,'');
function getReview(r){return store.reviewOverrides?.[r.id] || {checked:r.checked||'未確認',reviewDue:r.reviewDue||'',history:r.history||[]}}
function recordMeta(r,extra=''){
 const rev=getReview(r), src=(r.refs||[]).map(id=>sourceMap[id]).filter(Boolean);
 return `<div class="evid-meta"><span class="pill mini ${String(r.kind||'').match(/施設|未確認|案/)?'warn':'good'}">${en(r.kind||'文献情報')}</span><span class="pill mini ${r.certainty==='高'?'good':r.certainty==='未確認'?'warn':'blue'}">確実性 ${en(r.certainty||'未評価')}</span><span>文献 ${en(src.map(s=>String(s.year).slice(0,4)).join(' / ')||r.sourceYear||'未登録')}</span><span>確認 ${en(rev.checked)}</span><span>見直し ${en(rev.reviewDue||'未設定')}</span>${extra}</div><div class="evid-sources">${refsHtml(r.refs||[])}${r.sourceUrl&&safeURL(r.sourceUrl)?`<a class="ref" target="_blank" rel="noopener noreferrer" href="${en(safeURL(r.sourceUrl))}">↗ ユーザー登録の原典</a>`:''}</div>`
}
function viewPathways(x){
 let records=[...EVIDENCE.pathways,...(store.knowledgeEntries||[]).filter(z=>z.section==='pathways')].filter(z=>z.cancer===x.id);
 const stages=[...new Set(records.map(r=>r.stage).filter(Boolean))],purposes=[...new Set(records.map(r=>r.intent).filter(Boolean))];
 let shown=records.filter(r=>(pathStage==='all'||r.stage===pathStage)&&(pathPurpose==='all'||r.intent===pathPurpose)&&(!pathQuery||normalize(JSON.stringify(r)).includes(normalize(pathQuery))));
 const select=(id,vals,selected,allLabel)=>`<select id="${id}"><option value="all">${allLabel}</option>${vals.map(v=>`<option value="${en(v)}" ${selected===v?'selected':''}>${en(v)}</option>`).join('')}</select>`;
 return `<div class="panel"><h2 class="panel-title">病期・リスク別クイック参照 <span class="pill">${records.length}件</span></h2><p class="panel-sub">原典に紐付けられた治療候補を病期・照射目的で検索。施設検討は標準処方ではありません。</p><div class="filters" style="flex-wrap:wrap">${select('pathStage',stages,pathStage,'すべての病期')}${select('pathPurpose',purposes,pathPurpose,'すべての治療目的')}<input id="pathQuery" placeholder="例：TNT / ADT / 放射線肺臓炎" value="${en(pathQuery)}" aria-label="病期別テキスト検索"></div><div class="evid-stack">${shown.map(r=>`<article class="evid-card" id="${safeKey(r.id)}"><div class="evid-top"><div><div class="muted minor">${en(r.stage)}　·　${en(r.risk)}</div><h3>${en(r.title)}</h3></div><div class="evid-dose">${en(r.dose)}</div></div>${isRt60Pathway(x,r)?renderRt60Detail():isRtSibPathway(x,r)?renderRtSibDetail():renderRtClinical(x,r,'pathway')}${recordMeta(r)}<details><summary>適応・照射範囲・併用・有害事象・予後を見る</summary><div class="evid-details"><div><b>照射範囲・CTV</b><p>${en(r.target)}</p></div><div><b>併用薬物療法</b><p>${en(r.systemic)}</p></div><div><b>代表的な有害事象</b><p>${en(r.adverse)}</p></div><div><b>対応・注意</b><p>${en(r.care)}</p></div><div><b>予後・試験成績</b><p>${en(r.outcome)}</p></div>${r.context?`<div class="wide"><b>適用条件・備考</b><p>${en(r.context)}</p></div>`:''}</div></details><div class="evid-actions"><button class="btn small" data-review="${en(r.id)}">確認・次回見直し日を記録</button><button class="btn small" data-case-new="${en(x.id)}">症例メモ</button></div></article>`).join('')||'<div class="empty">条件に一致するエビデンスはありません。未確認情報を自動補完しません。</div>'}</div></div>`
}
function viewDifferences(x){let arr=EVIDENCE.differences.filter(z=>z.cancer===x.id);return `<section class="panel"><h2 class="panel-title">日・欧・米の相違点と施設運用</h2><div class="info-banner">各欄はガイドラインの要約・比較メモです。推奨強度が同じとは限らず、欧米に差異がない項目もあります。</div>${arr.map(r=>`<article class="evid-card"><h3>${en(r.title)}</h3><div class="compare-grid"><div><b>日本</b><p>${en(r.jp)}</p></div><div><b>米国</b><p>${en(r.us)}</p></div><div><b>欧州</b><p>${en(r.eu)}</p></div></div><div class="local-warning"><b>施設運用・検討記録（独立管理）</b><p>${en(r.local)}</p></div>${recordMeta({...r,kind:'ガイドライン比較',reviewDue:'2027-02-12'})}<div class="evid-actions"><button class="btn small" data-review="${en(r.id)}">比較内容の見直し記録</button></div></article>`).join('')||'<div class="empty">この癌種の地域間比較は現在未整備です。</div>'}</section>`}
function renderOARGlobal(){
 let records=[...EVIDENCE.oar,...(store.knowledgeEntries||[]).filter(z=>z.section==='oar')];
 let cids=[...new Set(records.map(r=>r.cancer))], orgs=[...new Set(records.map(r=>r.organ).filter(Boolean))].sort(), fracs=[...new Set(records.map(r=>String(r.fx)))].sort((a,b)=>Number(a)-Number(b)), intents=[...new Set(records.map(r=>r.intent).filter(Boolean))];
 const opts=(id,arr,val,label,toLabel)=>`<select id="${id}"><option value="all">${label}</option>${arr.map(z=>`<option value="${en(z)}" ${String(val)===String(z)?'selected':''}>${en(toLabel?toLabel(z):z)}</option>`).join('')}</select>`;
 let rows=records.filter(r=>(globalOarCancer==='all'||r.cancer===globalOarCancer)&&(globalOarFx==='all'||String(r.fx)===globalOarFx)&&(globalOarIntent==='all'||r.intent===globalOarIntent)&&(globalOarOrgan==='all'||r.organ===globalOarOrgan)&&(!globalOarQuery||normalize(JSON.stringify(r)).includes(normalize(globalOarQuery))));
 return `<div class="kicker">CROSS-CANCER OAR / EXPLICIT FRACTIONATION</div><div class="head"><div><h1 class="page-title">横断OAR制約検索</h1><p class="description">分割数・照射目的・癌種・臓器で絞り込みます。別分割への換算は自動で行いません。</p></div><div class="head-actions">${button('＋ 制約メモ登録','addOAR','btn primary')}</div></div><div class="notice"><b>医療安全：</b> 適用前に輪郭定義・Dmax / D0.03cc、% / cc、照射歴、原典の制約強度を必ず確認してください。未収載の分割回数は「データなし」です。</div><section class="panel"><div class="filters flex-filters">${opts('globalOarCancer',cids,globalOarCancer,'すべての癌種',id=>cancers().find(x=>x.id===id)?.name||id)}${opts('globalOarFx',fracs,globalOarFx,'すべての分割',z=>z+'回')}${opts('globalOarIntent',intents,globalOarIntent,'すべての目的')}${opts('globalOarOrgan',orgs,globalOarOrgan,'すべての臓器')}<input id="globalOarQuery" value="${en(globalOarQuery)}" placeholder="例：V20 / CHHiP" aria-label="OAR検索"></div><div class="minor muted" style="margin:9px 0">${rows.length} / ${records.length} 件</div><div class="table-scroll"><table class="oar-grid"><thead><tr><th>癌種・意図</th><th>臓器</th><th>分割</th><th>DVH指標</th><th>制約値</th><th>制約の性質・原典</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${en(cancers().find(c=>c.id===r.cancer)?.name||'その他')}</b><div class="minor muted">${en(r.intent)}</div></td><td>${en(r.organ)}</td><td><strong>${en(r.fx)}</strong>回</td><td><b>${en(r.metric)}</b></td><td><b>${en(r.limit)}</b></td><td><div class="minor">${en(r.kind)}</div><div class="minor muted">${en(r.definition)}</div>${r.comment?`<div class="minor" style="color:var(--orange)">${en(r.comment)}</div>`:''}${recordMeta(r)}</td></tr>`).join('')}</tbody></table></div>${!rows.length?'<div class="empty">一致する制約は登録されていません。任意の分割へ換算しないでください。</div>':''}</section>`
}
function viewKnowledge(x){let a=(store.knowledgeEntries||[]).filter(r=>r.cancer===x.id);return `<section class="panel"><h2 class="panel-title">独自知見・院内方針 ${button('＋ 情報追加','addKnowledge','btn small primary')}</h2><div class="info-banner warn-banner">ガイドライン由来・施設承認済・院内検討・未確認情報を分けて保存します。ここへの追加は公開データの自動改訂ではありません。</div>${a.map(r=>`<div class="evid-card"><h3>${en(r.title)}</h3><p>${en(r.body||r.definition||'')}</p>${recordMeta(r)}${r.sourceUrl&&safeURL(r.sourceUrl)?`<a target="_blank" rel="noopener noreferrer" href="${en(safeURL(r.sourceUrl))}">独自資料の参照先 ↗</a>`:''}<div class="evid-actions"><button class="btn small" data-knowledge-edit="${en(r.id)}">編集</button><button class="btn small danger" data-knowledge-del="${en(r.id)}">削除</button></div></div>`).join('')||'<div class="empty">この癌種の追加情報はありません。</div>'}</section>`}
function renderCases(){const cases=store.caseRecords||[];let cn=(id)=>cancers().find(c=>c.id===id)?.name||'その他';return `<div class="kicker">LOCAL ANONYMIZED CASE NOTES</div><div class="head"><div><h1 class="page-title">症例ごとの検討事項</h1><p class="description">非識別化した症例コード・問題点・再検討日を保存します。</p></div><div class="head-actions">${button('＋ 症例メモ','addCase','btn primary')}</div></div><div class="notice"><b>重要：</b> ローカルストレージは暗号化された診療録ではありません。氏名・ID・生年月日・画像・組み合わせで特定できる情報は登録しないでください。バックアップJSONの取り扱いにも注意。</div><section class="panel"><h2 class="panel-title">登録 ${cases.length}件</h2>${cases.map(r=>`<article class="evid-card"><div class="evid-top"><div><h3>${en(r.code)}</h3><span class="muted minor">${en(cn(r.cancer))} ／ ${en(r.stage)}</span></div><span class="pill mini ${r.status==='済'?'good':'warn'}">${en(r.status)}</span></div><p class="case-text">${en(r.body)}</p><p class="minor muted">検討事項：${en(r.todo||'なし')} ／ 次回見直し：${en(r.reviewDue||'未設定')} ／ 更新：${en(r.updated||r.created||'')}</p><div class="evid-actions"><button class="btn small" data-case-edit="${en(r.id)}">編集・追記</button><button class="btn small danger" data-case-del="${en(r.id)}">削除</button></div></article>`).join('')||'<div class="empty">まだ症例メモはありません。</div>'}</section>`}
function renderReviews(){const due=(d)=>d&&d<nowISO();let records=[...EVIDENCE.pathways,...EVIDENCE.oar,...(store.knowledgeEntries||[])];let overdue=records.filter(r=>due(getReview(r).reviewDue));let upcoming=records.filter(r=>!due(getReview(r).reviewDue)).sort((a,b)=>String(getReview(a).reviewDue).localeCompare(String(getReview(b).reviewDue))).slice(0,12);let cs=(store.caseRecords||[]).filter(x=>due(x.reviewDue));let logs=(store.audit||[]).slice(0,30);return `<div class="kicker">REVIEW TRACKING / LOCAL HISTORY</div><div class="head"><div><h1 class="page-title">更新履歴・次回見直し</h1><p class="description">アプリに保存したメモの変更記録と、エビデンスの次回確認日を一覧できます。</p></div></div><div class="stats"><div class="stat"><span>見直し期限超過</span><strong>${overdue.length}</strong></div><div class="stat"><span>期限超過症例</span><strong>${cs.length}</strong></div><div class="stat"><span>記録操作</span><strong>${(store.audit||[]).length}</strong></div><div class="stat"><span>次回確認予定</span><strong>${upcoming.length}</strong></div></div><section class="panel"><h2 class="panel-title">要見直し ${overdue.length}件</h2>${overdue.map(r=>`<div class="review-row"><span>${en(r.title||r.organ+' '+r.metric)}</span><span>${en(getReview(r).reviewDue)}</span><button class="btn small" data-review="${en(r.id)}">記録</button></div>`).join('')||'<p class="muted minor">期限超過はありません。定期的な原典の確認は別途必要です。</p>'}<h2 class="panel-title">次回見直し予定（先頭12件）</h2>${upcoming.map(r=>`<div class="review-row"><span>${en(r.title||r.organ+' '+r.metric)}</span><span>${en(getReview(r).reviewDue)}</span><button class="btn small" data-review="${en(r.id)}">記録</button></div>`).join('')}</section><section class="panel"><h2 class="panel-title">操作・更新履歴（新しい順）</h2>${logs.map(l=>`<div class="review-row"><span>${en(l.text)}</span><span class="muted minor">${en(l.date)}</span></div>`).join('')||'<p class="muted minor">まだ変更記録はありません。</p>'}</section><div class="panel"><h2 class="panel-title">バックアップ</h2><p>症例・独自知見・確認履歴をJSONとして保存・復元できます。復元は端末の既存データを上書きします。</p>${button('JSONを保存','export')}${button('JSONから復元','import')}</div>`}
function audit(text){store.audit=store.audit||[];store.audit.unshift({date:new Date().toISOString().slice(0,16).replace('T',' '),text:String(text).slice(0,250)});store.audit=store.audit.slice(0,300)}
function modalReview(id){let r=[...EVIDENCE.pathways,...EVIDENCE.oar,...EVIDENCE.differences,...(store.knowledgeEntries||[])].find(x=>x.id===id);if(!r)return;let rev=getReview(r),name=r.title||(r.organ+' '+r.metric);openModal(`<form id="reviewForm"><h2>原典確認・見直し記録</h2><p><b>${en(name)}</b></p><p class="minor muted">数値の正しさを自動で判定しません。出典照合後に医師自身の記録として保存してください。</p><div class="field"><label>確認した日</label><input id="revChecked" type="date" required value="${en(rev.checked==='未確認'?nowISO():rev.checked)}"></div><div class="field"><label>次回見直し日</label><input id="revDue" type="date" required value="${en(rev.reviewDue||'2027-02-12')}"></div><div class="field"><label>確認事項・変更点</label><textarea id="revReason" maxlength="2000" required placeholder="照合したガイドライン、相違、未解決点など"></textarea></div><div class="dialog-actions"><button type="button" class="btn" data-act="closeModal">キャンセル</button><button type="submit" class="btn primary">記録する</button></div></form>`);document.getElementById('reviewForm').addEventListener('submit',e=>{e.preventDefault();let date=document.getElementById('revChecked').value,due=document.getElementById('revDue').value,reason=document.getElementById('revReason').value.trim();if(!date||!due||!reason)return;store.reviewOverrides=store.reviewOverrides||{};let prev=store.reviewOverrides[id]||{history:[]};store.reviewOverrides[id]={checked:date,reviewDue:due,history:[...prev.history,{date,reason}]};audit('照合記録：'+name+' / '+reason.slice(0,65));persist();closeModal();render();flash('確認履歴と次回見直し日を保存しました')})}
function modalCase(editId='',cancerOverride=''){let r=(store.caseRecords||[]).find(x=>x.id===editId)||{};let options=cancers().map(c=>`<option value="${en(c.id)}" ${c.id===(r.cancer||cancerOverride||current)?'selected':''}>${en(c.name)}</option>`).join('');openModal(`<form id="caseForm"><h2>${r.id?'症例メモの編集':'新しい症例メモ'}</h2><p class="info-banner warn-banner">氏名・患者ID・生年月日・患者特定情報を入力しない。病院の正式診療録の代替ではありません。</p><div class="field"><label>匿名の症例コード（例：Case A）</label><input required maxlength="60" id="caseCode" value="${en(r.code||'')}"></div><div class="field"><label>癌種</label><select id="caseCancer">${options}</select></div><div class="field"><label>病期・リスク分類（個人を特定しない範囲）</label><input maxlength="120" id="caseStage" value="${en(r.stage||'')}"></div><div class="field"><label>検討事項・方針</label><textarea id="caseBody" maxlength="8000" required>${en(r.body||'')}</textarea></div><div class="field"><label>次回検討する事項</label><textarea id="caseTodo" maxlength="4000">${en(r.todo||'')}</textarea></div><div class="field"><label>状況</label><select id="caseStatus"><option ${!r.status||r.status==='検討中'?'selected':''}>検討中</option><option ${r.status==='済'?'selected':''}>済</option><option ${r.status==='要確認'?'selected':''}>要確認</option></select></div><div class="field"><label>次回見直し日</label><input id="caseDue" type="date" value="${en(r.reviewDue||'2026-12-12')}"></div><div class="dialog-actions"><button type="button" class="btn" data-act="closeModal">キャンセル</button><button type="submit" class="btn primary">保存</button></div></form>`);document.getElementById('caseForm').addEventListener('submit',e=>{e.preventDefault();let item={id:r.id||'case_'+Date.now(),code:document.getElementById('caseCode').value.trim(),cancer:document.getElementById('caseCancer').value,stage:document.getElementById('caseStage').value.trim(),body:document.getElementById('caseBody').value.trim(),todo:document.getElementById('caseTodo').value.trim(),status:document.getElementById('caseStatus').value,reviewDue:document.getElementById('caseDue').value,created:r.created||nowISO(),updated:nowISO()};if(!item.code||!item.body)return;store.caseRecords=store.caseRecords||[];store.caseRecords=r.id?store.caseRecords.map(z=>z.id===r.id?item:z):[item,...store.caseRecords];audit((r.id?'症例メモ更新：':'症例メモ追加：')+item.code);persist();closeModal();navigate('_cases')})}
function modalKnowledge(editId='',forcedOAR=false){let r=(store.knowledgeEntries||[]).find(z=>z.id===editId)||{},isOAR=forcedOAR||r.section==='oar';openModal(`<form id="knowledgeForm"><h2>${r.id?'知見を編集':isOAR?'OAR制約メモを追加':'施設方針・知見を追加'}</h2><p class="minor muted">正式な学会推奨／査読付き論文／院内承認プロトコール／未確認を明確に分けて登録してください。個人情報は含めないでください。</p><div class="field"><label>癌種</label><select id="kCancer">${cancers().map(c=>`<option value="${en(c.id)}" ${c.id===(r.cancer||current)?'selected':''}>${en(c.name)}</option>`).join('')}</select></div><div class="field"><label>タイトル</label><input id="kTitle" maxlength="150" required value="${en(r.title||'')}"></div><div class="field"><label>分類</label><select id="kKind">${['未確認・要登録','文献に基づく検討','施設運用・要確認','施設検討・未承認','施設承認済みプロトコール'].map(z=>`<option ${z===r.kind?'selected':''}>${en(z)}</option>`).join('')}</select></div><div class="field"><label>確実性（内部暫定評価）</label><select id="kCert">${['未確認','低','中','高'].map(z=>`<option ${z===(r.certainty||'未確認')?'selected':''}>${z}</option>`).join('')}</select></div>${isOAR?`<div class="field"><label>臓器名</label><input id="kOrgan" required value="${en(r.organ||'')}"></div><div class="field"><label>分割回数（整数）</label><input id="kFx" required inputmode="numeric" type="number" min="1" max="60" value="${en(r.fx||'')}"></div><div class="field"><label>照射目的</label><select id="kIntent">${['根治','術後','局所制御','緩和'].map(z=>`<option ${z===r.intent?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label>DVH指標</label><input id="kMetric" required placeholder="例：V20 Gy" value="${en(r.metric||'')}"></div><div class="field"><label>数値／制約値</label><input id="kLimit" required placeholder="例：未確認、または ≤20 Gy" value="${en(r.limit||'')}"></div>`:`<div class="field"><label>登録区分</label><select id="kSection"><option value="pathways" ${!r.section||r.section==='pathways'?'selected':''}>治療方針・処方</option><option value="knowledge" ${r.section==='knowledge'?'selected':''}>院内方針・考察</option></select></div><div class="field"><label>本文・適用条件</label><textarea id="kBody" maxlength="10000" required>${en(r.body||'')}</textarea></div>`}<div class="field"><label>原典URL（任意）</label><input id="kUrl" type="url" value="${en(r.sourceUrl||'')}"></div><div class="field"><label>文献発行年（任意）</label><input id="kYear" maxlength="4" inputmode="numeric" value="${en(r.sourceYear||'')}"></div><div class="field"><label>最終確認日</label><input id="kChecked" type="date" value="${en(r.checked||nowISO())}" required></div><div class="field"><label>次回見直し日</label><input id="kDue" type="date" value="${en(r.reviewDue||'2027-02-12')}" required></div><div class="dialog-actions"><button type="button" class="btn" data-act="closeModal">キャンセル</button><button type="submit" class="btn primary">保存する</button></div></form>`);document.getElementById('knowledgeForm').addEventListener('submit',e=>{e.preventDefault();let get=(id)=>document.getElementById(id)?.value.trim()||'';let url=get('kUrl');if(url&&!safeURL(url)){flash('URLが不正です');return}let z={id:r.id||'k_'+Date.now(),title:get('kTitle'),cancer:get('kCancer'),kind:get('kKind'),certainty:get('kCert'),checked:get('kChecked'),reviewDue:get('kDue'),sourceUrl:url,sourceYear:get('kYear'),refs:[],history:[...(r.history||[]),{date:nowISO(),action:r.id?'編集':'追加'}]};if(isOAR){Object.assign(z,{section:'oar',organ:get('kOrgan'),fx:Number(get('kFx')),intent:get('kIntent'),metric:get('kMetric'),limit:get('kLimit'),definition:get('kTitle')});if(!Number.isInteger(z.fx)||!z.organ||!z.limit||!z.metric)return}else{Object.assign(z,{section:get('kSection'),body:get('kBody'),stage:'院内知見',risk:'カスタム',dose:'登録内容を参照',fx:null,intent:'施設検討',target:get('kBody'),systemic:'原典を確認',adverse:'原典を確認',care:'原典を確認',outcome:'原典を確認'});if(!z.body)return}if(!z.title)return;store.knowledgeEntries=store.knowledgeEntries||[];store.knowledgeEntries=r.id?store.knowledgeEntries.map(x=>x.id===r.id?z:x):[z,...store.knowledgeEntries];audit((r.id?'知見更新：':'知見追加：')+z.title);persist();closeModal();if(isOAR)navigate('_oarall');else navigate(z.cancer,'knowledge')})}
function deleteCase(id){let r=(store.caseRecords||[]).find(x=>x.id===id);if(!r||!confirm('この症例メモを削除しますか？'))return;store.caseRecords=store.caseRecords.filter(x=>x.id!==id);audit('症例メモ削除：'+r.code);persist();render()}
function deleteKnowledge(id){let r=(store.knowledgeEntries||[]).find(x=>x.id===id);if(!r||!confirm('この独自情報を削除しますか？'))return;store.knowledgeEntries=store.knowledgeEntries.filter(x=>x.id!==id);audit('知見削除：'+r.title);persist();render()}

function viewFromPaths(x,field,title){let rows=EVIDENCE.pathways.filter(r=>r.cancer===x.id);return `<section class="panel"><h2 class="panel-title">${en(title)}</h2>${rows.map(r=>`<div class="brief-evidence"><div class="minor muted">${en(r.stage)}／${en(r.title)}</div><p>${en(r[field])}</p>${field==='adverse'?`<p class="minor"><b>対応：</b>${en(r.care)}</p>`:''}${recordMeta(r)}</div>`).join('')||'<div class="empty">項目は未整備です。</div>'}</section>`}
document.body.classList.toggle('dark',store.theme==='dark');render();
let direct=location.hash.match(/^#article\/([a-z0-9_-]+)$/);if(direct&&clinicalById[direct[1]]){articleBack={id:clinicalById[direct[1]].cancer==='general'?'_clinical':clinicalById[direct[1]].cancer,tab:clinicalById[direct[1]].section};openClinicalNote(direct[1],true);}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
